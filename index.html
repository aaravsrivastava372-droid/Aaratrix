<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Who's Watching?</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="profiles">

    <h1>Who's Watching?</h1>

    <div class="profile-container">

        <div class="profile" id="aaratrika">

            <img src="aaratrika-profile.jpg"
     class="profilePic"
     alt="Aaratrika">

            <p>Aaratrika</p>

        </div>

        <div class="profile" id="dobby">

            <img src="dobby-profile.jpg"
     class="profilePic"
     alt="Dobby">
            <p>Dobby</p>

        </div>

    </div>

</div>

<div id="toast">
    🧦 Dobby says: "Only Aaratrika can watch this."
</div>

<script src="script.js"></script>

</body>

</html>
